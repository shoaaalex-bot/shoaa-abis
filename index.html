<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم إرسال قراءات الفروع - شركة شعاع للخدمات العامة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #1f4e78; margin-bottom: 25px; font-size: 22px; border-bottom: 2px solid #e1e8ed; padding-bottom: 15px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #2c3e50; }
        select, textarea, input { width: 100%; padding: 12px; border: 1px solid #ccd1d9; border-radius: 6px; font-size: 14px; background: #fafbfc; }
        select:focus, textarea:focus, input:focus { border-color: #1f4e78; outline: none; background: #fff; }
        textarea { resize: vertical; height: 120px; }
        button { background-color: #1f4e78; color: white; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.3s; }
        button:hover { background-color: #15395b; }
        #status { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; text-align: center; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info-box { background: #eef2f7; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; color: #4a5568; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة إرسال إشعارات الفروع والبوتات الرئيسية<br><span style="font-size: 14px; color: #555;">شركة شعاع للخدمات العامة - قطاع الإسكندرية</span></h1>
    
    <div class="info-box">
        مرحباً بك. حدد الفرع المطلوب لإرسال الرسالة؛ سيقوم النظام تلقائياً بإرسال الإشعار إلى <strong>مجموعة الفرع المخصصة</strong> وأيضاً إلى <strong>البوتات الرئيسية</strong> للشركة لضمان المتابعة الشاملة.
    </div>

    <div class="form-group">
        <label for="branchSelect">اختر الفرع:</label>
        <select id="branchSelect">
            <option value="">-- اختر الفرع المستهدف --</option>
            <option value="ابوقير">فرع ابوقير</option>
            <option value="الراس السوداء">فرع الراس السوداء</option>
            <option value="المندره">فرع المندره</option>
            <option value="الجلاء">فرع الجلاء</option>
            <option value="خورشيد">فرع خورشيد</option>
            <option value="سيدى بشر">فرع سيدى بشر</option>
            <option value="السيوف">فرع السيوف</option>
            <option value="الهانوفيل">فرع الهانوفيل</option>
            <option value="الساحل">فرع الساحل</option>
            <option value="اكتوبر">فرع اكتوبر</option>
            <option value="البرج الجديد">فرع البرج الجديد</option>
            <option value="الحمام">فرع الحمام</option>
            <option value="البيطاش">فرع البيطاش</option>
            <option value="بيانكي">فرع بيانكي</option>
            <option value="القباري">فرع القباري</option>
            <option value="الدخيله">فرع الدخيله</option>
            <option value="العامريه">فرع العامريه</option>
            <option value="مرغم">فرع مرغم</option>
        </select>
    </div>

    <div class="form-group">
        <label for="messageText">نص الرسالة / التقرير:</label>
        <textarea id="messageText" placeholder="اكتب تفاصيل القراءات أو التقرير هنا..."></textarea>
    </div>

    <button onclick="sendToTelegram()">إرسال إلى الفرع والبوتات الرئيسية</button>

    <div id="status"></div>
</div>

<script>
    // جدول ربط الفروع بالتوكنات و Chat IDs
    const branchMapping = {
        "ابوقير": { chatId: "-1004478211758", token: "8835449060:AAHgIMDFyx6Hhih9zxN9-I6YrVJl4nuT3ng" },
        "الراس السوداء": { chatId: "-1004478211758", token: "8835449060:AAHgIMDFyx6Hhih9zxN9-I6YrVJl4nuT3ng" },
        "المندره": { chatId: "-1003598093807", token: "8605611092:AAG2QKTtoauHb_qNZgQuQp-NTVJuuFKzPVE" },
        "الجلاء": { chatId: "-1003598093807", token: "8605611092:AAG2QKTtoauHb_qNZgQuQp-NTVJuuFKzPVE" },
        "خورشيد": { chatId: "-1003363924237", token: "8886470238:AAGr1Og7rI31TKOFFMH_G7KaUytNytDdECI" },
        "سيدى بشر": { chatId: "-1004326439141", token: "8809642370:AAH6H--mnSE-AasMyjymCeDzipQpUW37iRA" },
        "السيوف": { chatId: "-1004357312950", token: "8835449060:AAHgIMDFyx6Hhih9zxN9-I6YrVJl4nuT3ng" },
        "الهانوفيل": { chatId: "-1003997252714", token: "8605611092:AAG2QKTtoauHb_qNZgQuQp-NTVJuuFKzPVE" },
        "الساحل": { chatId: "-1003997252714", token: "8605611092:AAG2QKTtoauHb_qNZgQuQp-NTVJuuFKzPVE" },
        "اكتوبر": { chatId: "-1003997252714", token: "8605611092:AAG2QKTtoauHb_qNZgQuQp-NTVJuuFKzPVE" },
        "البرج الجديد": { chatId: "-1003917417643", token: "8886470238:AAGr1Og7rI31TKOFFMH_G7KaUytNytDdECI" },
        "الحمام": { chatId: "-1003917417643", token: "8886470238:AAGr1Og7rI31TKOFFMH_G7KaUytNytDdECI" },
        "البيطاش": { chatId: "-1004361499329", token: "8809642370:AAH6H--mnSE-AasMyjymCeDzipQpUW37iRA" },
        "بيانكي": { chatId: "-1004361499329", token: "8809642370:AAH6H--mnSE-AasMyjymCeDzipQpUW37iRA" },
        "القباري": { chatId: "-1004445779479", token: "8835449060:AAHgIMDFyx6Hhih9zxN9-I6YrVJl4nuT3ng" },
        "الدخيله": { chatId: "-1004445779479", token: "8835449060:AAHgIMDFyx6Hhih9zxN9-I6YrVJl4nuT3ng" },
        "العامريه": { chatId: "-1003938688150", token: "8605611092:AAG2QKTtoauHb_qNZgQuQp-NTVJuuFKzPVE" },
        "مرغم": { chatId: "-1003938688150", token: "8605611092:AAG2QKTtoauHb_qNZgQuQp-NTVJuuFKzPVE" }
    };

    // البوتات الرئيسية للشركة
    const mainBots = [
        { name: "البوت الرئيسي 1", token: "8835449060:AAHgIMDFyx6Hhih9zxN9-I6YrVJl4nuT3ng" },
        { name: "البوت الرئيسي 2", token: "8605611092:AAG2QKTtoauHb_qNZgQuQp-NTVJuuFKzPVE" },
        { name: "البوت الرئيسي 3", token: "8886470238:AAGr1Og7rI31TKOFFMH_G7KaUytNytDdECI" },
        { name: "البوت الرئيسي 4", token: "8809642370:AAH6H--mnSE-AasMyjymCeDzipQpUW37iRA" }
    ];

    async function sendToTelegram() {
        const branch = document.getElementById('branchSelect').value;
        const text = document.getElementById('messageText').value.trim();
        const statusDiv = document.getElementById('status');

        if (!branch) {
            alert('الرجاء اختيار الفرع أولاً');
            return;
        }
        if (!text) {
            alert('الرجاء كتابة نص الرسالة');
            return;
        }

        statusDiv.style.display = 'block';
        statusDiv.className = '';
        statusDiv.innerHTML = 'جاري الإرسال إلى الفرع والبوتات الرئيسية...';

        const mapping = branchMapping[branch];
        const formattedMessage = `📌 *إشعار فرع: ${branch}*\n\n${text}`;

        try {
            // 1. إرسال لمجموعة الفرع الخاصة
            const branchUrl = `https://api.telegram.org/bot${mapping.token}/sendMessage`;
            await fetch(branchUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: mapping.chatId, text: formattedMessage, parse_mode: 'Markdown' })
            });

            // 2. إرسال لكافة البوتات الرئيسية للمتابعة
            for (let bot of mainBots) {
                const mainUrl = `https://api.telegram.org/bot${bot.token}/sendMessage`;
                await fetch(mainUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: mapping.chatId, text: `🔔 *نسخة ${bot.name}*\nفرع: ${branch}\n${text}`, parse_mode: 'Markdown' })
                });
            }

            statusDiv.className = 'success';
            statusDiv.innerHTML = '✅ تم إرسال الرسالة بنجاح إلى مجموعة الفرع وكافة البوتات الرئيسية!';
        } catch (error) {
            statusDiv.className = 'error';
            statusDiv.innerHTML = '❌ حدث خطأ أثناء الإرسال: ' + error.message;
        }
    }
</script>

</body>
</html>
