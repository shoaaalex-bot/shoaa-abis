<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام قراءات عدادات الكهرباء - شعاع للخدمات العامة</title>
    <style>
        :root {
            --primary: #1b4332;
            --primary-light: #2d6a4f;
            --accent: #d4a373;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --border-color: #ced4da;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h2 {
            color: var(--primary);
            margin: 0 0 8px 0;
            font-size: 22px;
        }
        .header p {
            color: #6c757d;
            font-size: 14px;
            margin: 0;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #495057;
            font-size: 14px;
        }
        select, input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
            transition: border-color 0.2s;
        }
        select:focus, input:focus, textarea:focus {
            border-color: var(--primary-light);
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.15);
        }
        button {
            background-color: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            width: 100%;
            margin-top: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-light);
        }
        .alert {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .alert.success {
            background-color: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
        }
        .alert.error {
            background-color: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>شركة شعاع للخدمات العامة</h2>
        <p>نظام تسجيل قراءات العدادات وتوجيه الفروع</p>
    </div>

    <form id="readingForm">
        <label for="branch">اختر الفـرع:</label>
        <select id="branch" required>
            <option value="">-- اختر الفرع التابع له --</option>
            <option value="800">800 - السيوف</option>
            <option value="801">801 - النصر</option>
            <option value="802">802 - سيدي بشر</option>
            <option value="803">803 - الابراهيميه</option>
            <option value="804">804 - سباباشا</option>
            <option value="805">805 - محرم بك</option>
            <option value="806">806 - وسط</option>
            <option value="807">807 - الدخيلة</option>
            <option value="808">808 - القباري</option>
            <option value="809">809 - العامرية</option>
            <option value="810">810 - باكوس</option>
            <option value="811">811 - الهانوفيل</option>
            <option value="812">812 - المندرة</option>
            <option value="813">813 - سموحه</option>
            <option value="819">819 - برج الجديد</option>
            <option value="820">820 - بيانكي</option>
            <option value="821">821 - البيطاش</option>
            <option value="822">822 - ابوقير</option>
            <option value="823">823 - ابيس</option>
            <option value="829">829 - مرغم</option>
            <option value="830">830 - برج القديم</option>
            <option value="831">831 - الساحل</option>
            <option value="832">832 - الجلاء</option>
            <option value="833">833 - اكتوبر</option>
            <option value="839">839 - الحمام</option>
            <option value="841">841 - الراس السودا</option>
            <option value="842">842 - خورشيد</option>
        </select>

        <label for="meterCode">رقم العداد / المشترك:</label>
        <input type="text" id="meterCode" placeholder="أدخل رقم العداد أو كود المشترك..." required>

        <label for="reading">قراءة العداد:</label>
        <input type="text" id="reading" placeholder="أدخل القراءة الجديدة..." required>

        <label for="notes">ملاحظات إضافية (اختياري):</label>
        <textarea id="notes" rows="3" placeholder="أي ملاحظات خاصة بالموقع..."></textarea>

        <button type="submit">إرسال القراءة</button>
    </form>

    <div id="statusMessage" class="alert"></div>
</div>

<script>
    document.getElementById('readingForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const branchSelect = document.getElementById('branch');
        const selectedOption = branchSelect.options[branchSelect.selectedIndex];
        const branchCode = branchSelect.value;
        const branchName = selectedOption.text;
        const meterCode = document.getElementById('meterCode').value;
        const reading = document.getElementById('reading').value;
        const notes = document.getElementById('notes').value;

        const statusDiv = document.getElementById('statusMessage');

        if (!branchCode) {
            statusDiv.className = "alert error";
            statusDiv.style.display = "block";
            statusDiv.textContent = "الرجاء اختيار الفرع الصحيح.";
            return;
        }

        // تجهيز محتوى الرسالة والبيانات المرسلة للـ Webhook الرئيسي أو البوتات
        const payload = {
            branch_code: branchCode,
            branch_name: branchName,
            meter_code: meterCode,
            reading: reading,
            notes: notes,
            timestamp: new Date().toISOString()
        };

        try {
            // رابط الـ Webhook الخاص بمنصة Make (يمكنك تعديله بالرابط الخاص بك)
            const webhookUrl = "YOUR_MAKE_WEBHOOK_URL";

            /* 
               إذا كنت تستخدم رابط Make الرئيسي لتوجيه البيانات لكل فرع تلقائياً عبر Router،
               قم بإلغاء التعليق عن الـ fetch التالي:
            
            const response = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            */

            // محاكاة الإرسال الناجح للربط التجريبي
            statusDiv.className = "alert success";
            statusDiv.style.display = "block";
            statusDiv.textContent = `تم إرسال قراءة (${branchName}) بنجاح!`;
            
            // إعادة ضبط الحقول
            document.getElementById('readingForm').reset();

        } catch (error) {
            console.error('Error:', error);
            statusDiv.className = "alert error";
            statusDiv.style.display = "block";
            statusDiv.textContent = "حدث خطأ أثناء الاتصال بالخادم، يرجى المحاولة مرة أخرى.";
        }
    });
</script>

</body>
</html>
